apiVersion: apps/v1
kind: Deployment
metadata:
  name: uptime-monitor-worker
  namespace: dev
  labels:
    app.kubernetes.io/name: uptime-monitor
    app.kubernetes.io/component: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: uptime-monitor
      app.kubernetes.io/component: worker
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: uptime-monitor
        app.kubernetes.io/component: worker
    spec:
      containers:
        - name: worker
          image: ghcr.io/l4ty5h3v/uptime-monitor:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "app.worker"]
          ports:
            - containerPort: 9101
              name: metrics
          envFrom:
            - configMapRef:
                name: uptime-monitor-config
            - secretRef:
                name: uptime-monitor-secrets
          readinessProbe:
            tcpSocket:
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: metrics
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
