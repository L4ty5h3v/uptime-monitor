apiVersion: batch/v1
kind: Job
metadata:
  name: uptime-monitor-migrate
  namespace: dev
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: uptime-monitor
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: ghcr.io/l4ty5h3v/uptime-monitor:latest
          imagePullPolicy: IfNotPresent
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: uptime-monitor-config
            - secretRef:
                name: uptime-monitor-secrets
