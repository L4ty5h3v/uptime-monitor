apiVersion: v1
kind: Secret
metadata:
  name: {{ include "uptime-monitor.fullname" . }}-secrets
  labels:
    {{- include "uptime-monitor.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ .Values.secret.databaseUrl | quote }}
  REDIS_SENTINEL_HOSTS: {{ .Values.secret.redisSentinelHosts | quote }}
  REDIS_PASSWORD: {{ .Values.secret.redisPassword | quote }}
