apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "uptime-monitor.fullname" . }}-worker
  labels:
    {{- include "uptime-monitor.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels:
      {{- include "uptime-monitor.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        {{- include "uptime-monitor.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: worker
    spec:
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- range . }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      containers:
        - name: worker
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "-m", "app.worker"]
          ports:
            - name: metrics
              containerPort: 9101
          envFrom:
            - configMapRef:
                name: {{ include "uptime-monitor.fullname" . }}-config
            - secretRef:
                name: {{ include "uptime-monitor.fullname" . }}-secrets
          readinessProbe:
            tcpSocket:
              port: metrics
            initialDelaySeconds: {{ .Values.worker.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.worker.readinessProbe.periodSeconds }}
          livenessProbe:
            tcpSocket:
              port: metrics
            initialDelaySeconds: {{ .Values.worker.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.worker.livenessProbe.periodSeconds }}
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
