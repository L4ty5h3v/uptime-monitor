global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["127.0.0.1:9090"]

  - job_name: "node"
    static_configs:
      - targets: ["127.0.0.1:9100"]

  - job_name: "uptime-api"
    metrics_path: /metrics
    static_configs:
      - targets: ["127.0.0.1:8000"]

  - job_name: "uptime-worker"
    metrics_path: /metrics
    static_configs:
      - targets: ["127.0.0.1:9101"]

  - job_name: "redis-exporter"
    static_configs:
      - targets: ["127.0.0.1:9121"]