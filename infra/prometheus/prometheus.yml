global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["127.0.0.1:9090"]

  - job_name: "node"
    static_configs:
      - targets: ["127.0.0.1:9100"]

  - job_name: "uptime-api"
    metrics_path: /metrics
    static_configs:
      - targets: ["127.0.0.1:8000"]

  - job_name: "uptime-worker"
    metrics_path: /metrics
    static_configs:
      - targets: ["127.0.0.1:9101"]

  - job_name: "redis-exporter"
    static_configs:
      - targets: ["127.0.0.1:9121"]

  - job_name: postgres
    static_configs:
      - targets: [ "127.0.0.1:9187" ]

  - job_name: "node-k8s"
    static_configs:
      - targets:
          - "10.211.55.9:9100"
          - "10.211.55.6:9100"
          - "10.211.55.7:9100"
          - "10.211.55.10:9100"

  - job_name: "uptime-api-dev-k8s"
    metrics_path: /metrics
    static_configs:
      - targets: ["10.211.55.9:30080"]

  - job_name: "kube-state-metrics"
    metrics_path: /metrics
    static_configs:
      - targets: ["10.211.55.9:30081"]
