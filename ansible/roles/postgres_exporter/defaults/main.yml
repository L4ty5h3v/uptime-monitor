postgres_exporter_version: "0.19.1"
postgres_exporter_arch: "linux-arm64"

postgres_exporter_service_name: "postgres_exporter"
postgres_exporter_bin_path: "/usr/local/bin/postgres_exporter"
postgres_exporter_env_file: "/etc/postgres_exporter.env"
postgres_exporter_listen_address: ":9187"

postgres_exporter_db_user: "postgres_exporter"
postgres_exporter_db_password: "postgres_exporter"
postgres_exporter_db_host: "127.0.0.1"
postgres_exporter_db_port: 5432
postgres_exporter_db_name: "postgres"
postgres_exporter_db_sslmode: "disable"

postgres_exporter_download_url: "https://github.com/prometheus-community/postgres_exporter/releases/download/v{{ postgres_exporter_version }}/postgres_exporter-{{ postgres_exporter_version }}.{{ postgres_exporter_arch }}.tar.gz"

postgres_exporter_dsn: "postgresql://{{ postgres_exporter_db_user }}:{{ postgres_exporter_db_password }}@{{ postgres_exporter_db_host }}:{{ postgres_exporter_db_port }}/{{ postgres_exporter_db_name }}?sslmode={{ postgres_exporter_db_sslmode }}"