k8s_pki_repo_root: "{{ playbook_dir | dirname | dirname }}"
k8s_pki_local_dir: "{{ k8s_pki_repo_root }}/.artifacts/k8s-pki"
k8s_pki_local_certs_dir: "{{ k8s_pki_local_dir }}/certs"
k8s_pki_local_kubeconfigs_dir: "{{ k8s_pki_local_dir }}/kubeconfigs"
k8s_pki_local_configs_dir: "{{ k8s_pki_local_dir }}/configs"

k8s_pki_cluster_name: uptime-monitor-k8s
k8s_pki_control_plane_host: "{{ groups['k8s_control_plane'][0] }}"
k8s_pki_api_server_ip: "{{ hostvars[k8s_pki_control_plane_host]['ansible_host'] }}"
k8s_pki_api_server_endpoint: "https://{{ k8s_pki_api_server_ip }}:6443"
k8s_pki_kubernetes_service_ip: 10.32.0.1
k8s_pki_kubernetes_service_names:
  - kubernetes
  - kubernetes.default
  - kubernetes.default.svc
  - kubernetes.default.svc.cluster
  - kubernetes.default.svc.cluster.local

k8s_pki_certs:
  - name: admin
    common_name: admin
    organization: system:masters
    extended_key_usages:
      - clientAuth
  - name: kube-controller-manager
    common_name: system:kube-controller-manager
    extended_key_usages:
      - clientAuth
  - name: kube-scheduler
    common_name: system:kube-scheduler
    extended_key_usages:
      - clientAuth
  - name: kube-proxy
    common_name: system:kube-proxy
    organization: system:node-proxier
    extended_key_usages:
      - clientAuth
  - name: kube-apiserver-etcd-client
    common_name: kube-apiserver-etcd-client
    organization: Kubernetes
    extended_key_usages:
      - clientAuth
  - name: service-account
    common_name: service-accounts
    organization: Kubernetes
    extended_key_usages:
      - clientAuth
  - name: kubernetes
    common_name: kubernetes
    organization: Kubernetes
    extended_key_usages:
      - serverAuth
      - clientAuth
    subject_alt_names: "{{ [k8s_pki_api_server_ip, '127.0.0.1', k8s_pki_kubernetes_service_ip] + k8s_pki_kubernetes_service_names }}"
  - name: etcd-server
    common_name: etcd-server
    organization: Kubernetes
    extended_key_usages:
      - serverAuth
      - clientAuth
    subject_alt_names:
      - "{{ k8s_pki_api_server_ip }}"
      - 127.0.0.1
      - "{{ k8s_pki_control_plane_host }}"
  - name: cp1
    common_name: system:node:cp1
    organization: system:nodes
    extended_key_usages:
      - clientAuth
      - serverAuth
    subject_alt_names:
      - "{{ hostvars['cp1']['ansible_host'] }}"
      - cp1
  - name: worker1
    common_name: system:node:worker1
    organization: system:nodes
    extended_key_usages:
      - clientAuth
      - serverAuth
    subject_alt_names:
      - "{{ hostvars['worker1']['ansible_host'] }}"
      - worker1
  - name: worker2
    common_name: system:node:worker2
    organization: system:nodes
    extended_key_usages:
      - clientAuth
      - serverAuth
    subject_alt_names:
      - "{{ hostvars['worker2']['ansible_host'] }}"
      - worker2
  - name: worker3
    common_name: system:node:worker3
    organization: system:nodes
    extended_key_usages:
      - clientAuth
      - serverAuth
    subject_alt_names:
      - "{{ hostvars['worker3']['ansible_host'] }}"
      - worker3

k8s_pki_kubeconfig_specs:
  - name: admin
    user_name: admin
    cert_name: admin
  - name: kube-controller-manager
    user_name: system:kube-controller-manager
    cert_name: kube-controller-manager
  - name: kube-scheduler
    user_name: system:kube-scheduler
    cert_name: kube-scheduler
  - name: kube-proxy
    user_name: system:kube-proxy
    cert_name: kube-proxy
  - name: cp1
    user_name: system:node:cp1
    cert_name: cp1
  - name: worker1
    user_name: system:node:worker1
    cert_name: worker1
  - name: worker2
    user_name: system:node:worker2
    cert_name: worker2
  - name: worker3
    user_name: system:node:worker3
    cert_name: worker3
