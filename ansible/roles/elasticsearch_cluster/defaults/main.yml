elasticsearch_version: "8.19.14"
elasticsearch_arch: "linux-aarch64"
elasticsearch_download_url: "https://artifacts.elastic.co/downloads/elasticsearch/elasticsearch-{{ elasticsearch_version }}-{{ elasticsearch_arch }}.tar.gz"
elasticsearch_archive_name: "elasticsearch-{{ elasticsearch_version }}-{{ elasticsearch_arch }}"
elasticsearch_install_dir: "/opt/elasticsearch"
elasticsearch_home: "{{ elasticsearch_install_dir }}/{{ elasticsearch_archive_name }}"
elasticsearch_user: "elasticsearch"
elasticsearch_group: "elasticsearch"

elasticsearch_cluster_name: "uptime-cluster"
elasticsearch_network_host: "127.0.0.1"
elasticsearch_java_heap: "512m"

elasticsearch_nodes:
  - name: "es-node-1"
    http_port: 9200
    transport_port: 9300
    data_path: "/var/lib/elasticsearch-1"
    log_path: "/var/log/elasticsearch/es-node-1"
    config_path: "/etc/elasticsearch/es-node-1"

  - name: "es-node-2"
    http_port: 9201
    transport_port: 9301
    data_path: "/var/lib/elasticsearch-2"
    log_path: "/var/log/elasticsearch/es-node-2"
    config_path: "/etc/elasticsearch/es-node-2"

  - name: "es-node-3"
    http_port: 9202
    transport_port: 9302
    data_path: "/var/lib/elasticsearch-3"
    log_path: "/var/log/elasticsearch/es-node-3"
    config_path: "/etc/elasticsearch/es-node-3"

elasticsearch_seed_hosts:
  - "127.0.0.1:9300"
  - "127.0.0.1:9301"
  - "127.0.0.1:9302"

elasticsearch_initial_master_nodes:
  - "es-node-1"
  - "es-node-2"
  - "es-node-3"

elasticsearch_extra_settings: {}