- name: install required packages
  apt:
    name:
      - curl
      - tar
      - gzip
    state: present
    update_cache: yes

- name: ensure elasticsearch group exists
  group:
    name: "{{ elasticsearch_group }}"
    state: present
    system: yes

- name: ensure elasticsearch user exists
  user:
    name: "{{ elasticsearch_user }}"
    group: "{{ elasticsearch_group }}"
    system: yes
    create_home: no
    shell: /usr/sbin/nologin

- name: ensure install directory exists
  file:
    path: "{{ elasticsearch_install_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: download elasticsearch tar archive
  get_url:
    url: "{{ elasticsearch_download_url }}"
    dest: "/tmp/{{ elasticsearch_archive_name }}.tar.gz"
    mode: "0644"
    force: false

- name: unpack elasticsearch archive
  unarchive:
    src: "/tmp/{{ elasticsearch_archive_name }}.tar.gz"
    dest: "{{ elasticsearch_install_dir }}"
    remote_src: true
    creates: "{{ elasticsearch_home }}/bin/elasticsearch"

- name: ensure elasticsearch home ownership is correct
  file:
    path: "{{ elasticsearch_home }}"
    state: directory
    recurse: yes
    owner: root
    group: root