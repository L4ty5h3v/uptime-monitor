- name: install required packages
  apt:
    name:
      - curl
      - tar
      - gzip
    state: present
    update_cache: yes

- name: ensure elasticsearch group exists
  group:
    name: "{{ elasticsearch_group }}"
    state: present
    system: yes

- name: ensure elasticsearch user exists
  user:
    name: "{{ elasticsearch_user }}"
    group: "{{ elasticsearch_group }}"
    system: yes
    create_home: no
    shell: /usr/sbin/nologin

- name: ensure install directory exists
  file:
    path: "{{ elasticsearch_install_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: download elasticsearch tar archive
  get_url:
    url: "{{ elasticsearch_download_url }}"
    dest: "/tmp/elasticsearch-{{ elasticsearch_version }}.tar.gz"
    mode: "0644"
    force: false

- name: unpack elasticsearch archive
  unarchive:
    src: "/tmp/elasticsearch-{{ elasticsearch_version }}.tar.gz"
    dest: "{{ elasticsearch_install_dir }}"
    remote_src: true

- name: find elasticsearch binary
  find:
    paths: "{{ elasticsearch_install_dir }}"
    patterns: elasticsearch
    file_type: file
    recurse: yes
  register: elasticsearch_binaries

- name: fail if elasticsearch binary was not found
  fail:
    msg: "Elasticsearch binary not found under {{ elasticsearch_install_dir }}"
  when: elasticsearch_binaries.matched == 0

- name: set elasticsearch home from discovered binary
  set_fact:
    elasticsearch_home_discovered: "{{ elasticsearch_binaries.files | map(attribute='path') | select('match', '.*/bin/elasticsearch$') | list | first | dirname | dirname }}"

- name: fail if discovered elasticsearch home is empty
  fail:
    msg: "Failed to determine elasticsearch home directory"
  when: elasticsearch_home_discovered is not defined or elasticsearch_home_discovered | length == 0

- name: ensure elasticsearch launcher is executable
  file:
    path: "{{ elasticsearch_home_discovered }}/bin/elasticsearch"
    mode: "0755"

- name: ensure bundled java is executable
  file:
    path: "{{ elasticsearch_home_discovered }}/jdk/bin/java"
    mode: "0755"