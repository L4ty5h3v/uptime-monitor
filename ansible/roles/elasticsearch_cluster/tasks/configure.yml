- name: ensure elasticsearch config root exists
  file:
    path: /etc/elasticsearch
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: ensure per-node config directories exist
  file:
    path: "{{ item.config_path }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop: "{{ elasticsearch_nodes }}"

- name: ensure per-node data directories exist
  file:
    path: "{{ item.data_path }}"
    state: directory
    owner: "{{ elasticsearch_user }}"
    group: "{{ elasticsearch_group }}"
    mode: "0755"
  loop: "{{ elasticsearch_nodes }}"

- name: ensure per-node log directories exist
  file:
    path: "{{ item.log_path }}"
    state: directory
    owner: "{{ elasticsearch_user }}"
    group: "{{ elasticsearch_group }}"
    mode: "0755"
  loop: "{{ elasticsearch_nodes }}"

- name: deploy elasticsearch.yml for each node
  template:
    src: elasticsearch.yml.j2
    dest: "{{ item.config_path }}/elasticsearch.yml"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ elasticsearch_nodes }}"
  notify: restart elasticsearch nodes

- name: deploy jvm.options for each node
  template:
    src: jvm.options.j2
    dest: "{{ item.config_path }}/jvm.options"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ elasticsearch_nodes }}"
  notify: restart elasticsearch nodes