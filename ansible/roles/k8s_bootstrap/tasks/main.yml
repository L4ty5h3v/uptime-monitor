- name: update apt cache
  apt:
    update_cache: yes
    lock_timeout: 300

- name: install bootstrap packages
  apt:
    name: "{{ k8s_bootstrap_packages }}"
    state: present

- name: disable swap immediately
  command: swapoff -a
  when: ansible_facts["swaptotal_mb"] | int > 0

- name: disable swap in fstab
  replace:
    path: /etc/fstab
    regexp: '^([^#].*\sswap\s+.*)$'
    replace: '# \1'

- name: ensure kernel modules config exists
  copy:
    dest: /etc/modules-load.d/k8s.conf
    content: |
      {% for module in k8s_required_modules %}
      {{ module }}
      {% endfor %}
    owner: root
    group: root
    mode: "0644"

- name: load required kernel modules
  community.general.modprobe:
    name: "{{ item }}"
    state: present
  loop: "{{ k8s_required_modules }}"

- name: configure sysctl params for kubernetes
  copy:
    dest: /etc/sysctl.d/99-kubernetes-cri.conf
    content: |
      {% for key, value in k8s_sysctl_params.items() %}
      {{ key }} = {{ value }}
      {% endfor %}
    owner: root
    group: root
    mode: "0644"

- name: apply sysctl params
  command: sysctl --system
  changed_when: true

- name: ensure containerd config directory exists
  file:
    path: /etc/containerd
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: generate default containerd config if missing
  command: containerd config default
  register: containerd_default_config
  changed_when: false

- name: write containerd config
  copy:
    dest: "{{ containerd_config_path }}"
    content: "{{ containerd_default_config.stdout | regex_replace('SystemdCgroup = false', 'SystemdCgroup = true') }}"
    owner: root
    group: root
    mode: "0644"
  notify: restart containerd

- name: enable and start containerd
  systemd:
    name: containerd
    enabled: yes
    state: started
