redis_user: redis
redis_group: redis

redis_conf_dir: /etc/redis
redis_data_dir: /var/lib/redis
redis_log_dir: /var/log/redis

redis_master_name: mymaster
redis_master_host: 127.0.0.1
redis_master_port: 6379
redis_quorum: 2

redis_instances:
  - port: 6379
    role: master

  - port: 6380
    role: replica
    replicaof_host: 127.0.0.1
    replicaof_port: 6379

sentinel_instances:
  - port: 26379
  - port: 26380
  - port: 26381

sentinel_down_after_ms: 5000
sentinel_failover_timeout: 60000