name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HELM_CHART_PATH: ./helm/uptime-monitor
  KUBECONFORM_IMAGE: ghcr.io/yannh/kubeconform:v0.8.0
  PYTHONPATH: .

jobs:
  python:
    name: Python quality
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest ruff

      - name: Run Ruff correctness checks
        run: ruff check --select E4,E7,E9,F --ignore E402 app tests

      - name: Run tests
        run: pytest -q tests

  helm:
    name: Helm validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.17.3

      - name: Lint and render Helm profiles
        run: |
          for environment in dev qa prod; do
            helm lint "${HELM_CHART_PATH}" \
              -f "${HELM_CHART_PATH}/values-${environment}.yaml"
            helm template uptime-monitor "${HELM_CHART_PATH}" \
              --namespace "${environment}" \
              -f "${HELM_CHART_PATH}/values-${environment}.yaml" \
              > "rendered-${environment}.yaml"
          done

      - name: Validate Kubernetes manifests
        run: |
          for environment in dev qa prod; do
            docker run --rm -i "${KUBECONFORM_IMAGE}" \
              -strict \
              -summary \
              -ignore-missing-schemas \
              < "rendered-${environment}.yaml"
          done

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build application image
        run: docker build --tag uptime-monitor:ci .
