name: App operations

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Choose action"
        required: true
        default: "restart"
        type: choice
        options:
          - deploy
          - start
          - stop
          - restart
          - migrate

jobs:
  operate:
    runs-on: self-hosted

    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ansible
        run: |
          python -m pip install --upgrade pip
          pip install ansible

      - name: Run selected playbook
        run: |
          case "${{ github.event.inputs.action }}" in
            deploy)
              ansible-playbook -i ansible/inventory/hosts.ini ansible/playbooks/deploy_app.yml
              ;;
            start)
              ansible-playbook -i ansible/inventory/hosts.ini ansible/playbooks/start_app.yml
              ;;
            stop)
              ansible-playbook -i ansible/inventory/hosts.ini ansible/playbooks/stop_app.yml
              ;;
            restart)
              ansible-playbook -i ansible/inventory/hosts.ini ansible/playbooks/restart_app.yml
              ;;
            migrate)
              ansible-playbook -i ansible/inventory/hosts.ini ansible/playbooks/migration.yml
              ;;
            *)
              echo "Unknown action"
              exit 1
              ;;
          esac
