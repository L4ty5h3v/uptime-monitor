name: Ansible deploy pipeline

on:
  push:
    branches:
      - main
      - module-2-monitoring

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ansible
        run: |
          python -m pip install --upgrade pip
          pip install ansible

      - name: Deploy app via Ansible
        run: |
          cd ansible
          ansible-playbook playbooks/deploy_app.yml \
            -e "repo_version=${GITHUB_REF_NAME}"
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}

      - name: Run migrations via Ansible
        run: |
          cd ansible
          ansible-playbook playbooks/migration.yml

      - name: Restart app via Ansible
        run: |
          cd ansible
          ansible-playbook playbooks/restart_app.yml
          
          
